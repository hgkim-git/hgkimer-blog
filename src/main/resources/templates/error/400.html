<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>400 - 잘못된 요청</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/error-pages.css}">
  <link rel="icon" th:href="@{/img/favicon.ico}">
  <style>
    .error-code {
      color: #ed8936; /* 폴백 색상 */
      background: linear-gradient(135deg, #ed8936 0%, #c05621 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .error-emoji {
      animation: float 3s ease-in-out infinite;
    }
  </style>
</head>
<body>
<div class="error-container">
  <div class="error-content">
    <div class="error-emoji">⚠️</div>
    <div class="error-code">400</div>
    <h1 class="error-title">잘못된 요청입니다</h1>
    <p class="error-description">
      요청 형식이 올바르지 않거나 유효하지 않은 값이 포함되어 있습니다.<br>
      입력 값을 확인하고 다시 시도해주세요.
    </p>

    <div class="error-actions">
      <a class="btn btn-primary" th:href="@{/}">
        🏠 홈으로 돌아가기
      </a>
      <button class="btn btn-secondary" onclick="history.back()">
        ← 이전 페이지
      </button>
    </div>
  </div>
</div>

<script>
  const isDarkMode = localStorage.getItem('darkMode') === 'true' ||
      (!localStorage.getItem('darkMode') && window.matchMedia(
          '(prefers-color-scheme: dark)').matches);

  if (isDarkMode) {
    document.documentElement.classList.add('dark');
  }
</script>
</body>
</html>
